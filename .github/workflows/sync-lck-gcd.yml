name: Sync LCK GCD
on:
  schedule:
    - cron: '42 */6 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Validate source without publishing'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: lck-gcd-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test scripts/lck/gcd.test.mjs
      - name: Fetch and validate official GCD
        env:
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            node scripts/lck/sync-gcd.mjs --check
          else
            node scripts/lck/sync-gcd.mjs
          fi
      - name: Check whether snapshot changed
        id: changed
        run: |
          if git diff --quiet -- src/data/lck-gcd.json; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify changed snapshot with production build
        if: steps.changed.outputs.value == 'true'
        run: |
          npm ci
          npm run build
      - name: Publish only changed validated snapshot
        id: publish
        run: |
          if git diff --quiet -- src/data/lck-gcd.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/lck-gcd.json
          git commit -m "chore(lck): refresh validated GCD snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Optional Cloudflare Pages deploy hook
        if: steps.publish.outputs.changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.LCK_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_HOOK" >/dev/null
          fi
