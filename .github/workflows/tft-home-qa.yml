name: TFT Home QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/qa/**'
      - 'scripts/collector/**'
      - 'supabase/migrations/**'
      - 'scripts/prerender.ts'
      - 'public/sitemap.xml'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/tft-home-qa.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tft-home-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx scripts/qa/home-smoke.mjs
